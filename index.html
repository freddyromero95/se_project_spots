<!doctype html><html lang=en><head><meta charset=UTF-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=description content="A modern layout for the Spots project."><meta name=author content="Freddy Romero"><meta name=keywords content="image sharing, adaptive layout, spots, HTML, CSS"><title>Spots</title><link rel=icon href=favicon.ico><script defer src=main.js></script><link href=main.css rel=stylesheet></head><body><div class=page><header class=header><img src=315f49fc459de1bfa785.svg alt="Spots Logo" class=header__logo></header><main class=content><section class="profile page__section"><img src=2fc47fd8e9a9bcd9612f.jpg alt="Bessie Coleman" class=profile__avatar><div class=profile__column><h1 class=profile__name>Bessie Coleman</h1><p class=profile__description>Civil Aviator</p><button type=button class=profile__edit-btn><img src=03fcfd6582f118f2d4fa.svg alt="Pencil icon"> Edit Profile</button></div><button class=profile__new-post-btn type=button><img src=5d3f137969685e5485dd.svg alt="Plus icon"> New Post</button></section><section class="cards page__section"><ul class=cards__list></ul><template id=card-template><li class=card><button type=button class=card__delete-btn></button> <img class=card__image src=# alt="Card Image"><div class=card__content><h2 class=card__title></h2><button type=button class=card__like-btn></button></div></template></section></main><footer class="footer page__section"><p class=footer__text>2023 © Spots</footer><div class=modal id=edit-profile-modal><div class=modal__container><button type=button class=modal__close-btn></button><h2 class=modal__title>Edit Profile</h2><form class=modal__form name=edit-profile novalidate><label for=profile-name-input class=modal__label>Name <input id=profile-name-input name=name class=modal__input placeholder="Type your name" minlength=2 maxlength=40 required> <span id=profile-name-input-error class=modal__error></span></label> <label for=profile-description-input class=modal__label>Description <input id=profile-description-input name=description class=modal__input placeholder="Describe yourself" minlength=2 maxlength=200 required> <span id=profile-description-input-error class=modal__error></span></label> <button type=submit class=modal__submit-btn>Save</button></form></div></div><div class=modal id=new-post-modal><div class=modal__container><button type=button class=modal__close-btn></button><h2 class=modal__title>New Post</h2><form class=modal__form name=new-card novalidate><label for=card-image-input class=modal__label>Image link <input id=card-image-input name=link type=url class=modal__input placeholder="Place a link to the picture" required> <span id=card-image-input-error class=modal__error></span></label> <label for=card-caption-input class=modal__label>Caption <input id=card-caption-input name=caption class=modal__input placeholder="Type your caption" minlength=2 maxlength=30 required> <span id=card-caption-input-error class=modal__error></span></label> <button type=submit class="modal__submit-btn modal__submit-btn_disabled" disabled>Save</button></form></div></div><div class=modal id=preview-modal><div class=modal__preview-container><button type=button class="modal__close-btn modal__close-btn_type_preview"></button> <img class=modal__preview-image src=# alt="Preview Image"><p class=modal__preview-caption></div></div></div></body></html>
